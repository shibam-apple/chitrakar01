<title>Chitrakar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed paper canvas; thin chrome floats at the edges (top bar, bottom tool dock, selection bar beside the selection, Layers panel on the right). */
:root {
  --chrome: #ffffff;
  --chrome-2: #f1f1f6;
  --line: #dcdde7;
  --fg: #1b1c26;
  --fg-2: #5e6174;
  --accent: #3d47c9;
  --accent-soft: #e6e8fb;
  --accent-fg: #ffffff;
  --canvas: #e9e9ef;
  --dot: #c6c7d4;
  --tile: #f6f6f9;
  --danger: #c8322b;
  --shadow: rgba(22, 24, 48, 0.10);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #1e1f27; --chrome-2: #2a2b35; --line: #393b49; --fg: #ececf3; --fg-2: #a4a7b9;
    --accent: #8f97ff; --accent-soft: #2d3060; --accent-fg: #12132a;
    --canvas: #d9d9e0; --dot: #b6b7c5; --tile: #f1f1f5; --danger: #ff7a72; --shadow: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #1e1f27; --chrome-2: #2a2b35; --line: #393b49; --fg: #ececf3; --fg-2: #a4a7b9;
  --accent: #8f97ff; --accent-soft: #2d3060; --accent-fg: #12132a;
  --canvas: #d9d9e0; --dot: #b6b7c5; --tile: #f1f1f5; --danger: #ff7a72; --shadow: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--canvas); color: var(--fg); font-family: var(--ui);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#scene.panning { cursor: grabbing; }
#scene.space { cursor: grab; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.s { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.bar {
  background: var(--chrome); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 1px 2px var(--shadow), 0 6px 16px var(--shadow);
}

/* Top bar */
#top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#top > * { pointer-events: auto; }
.group { display: flex; align-items: center; gap: 2px; padding: 4px; }
.btn { min-width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; flex: none; }
.btn:hover { background: var(--chrome-2); }
.btn:disabled { opacity: 0.35; cursor: default; background: none; }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.btn.label { font-size: 13px; font-weight: 600; }
.doc { display: flex; flex-direction: column; line-height: 1.15; padding: 0 10px 0 4px; }
.doc b { font-size: 15px; font-weight: 600; }
.doc span { font-size: 12px; color: var(--fg-2); }
.chip { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.chip svg.i { width: 16px; height: 16px; }
#zoom { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; min-width: 64px; }

/* Bottom dock */
#dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 2px; padding: 6px;
  max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none;
}
#dock::-webkit-scrollbar { display: none; }
.tool { width: 62px; height: 56px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--fg-2); flex: none; }
.tool:hover { background: var(--chrome-2); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.tool[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.sep { width: 1px; height: 32px; background: var(--line); margin: 0 4px; flex: none; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--chrome); box-shadow: 0 0 0 1px var(--line); }

/* Popovers */
.pop { position: fixed; z-index: 8; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 220px; max-width: calc(100vw - 32px); max-height: calc(100% - 120px); overflow-y: auto; }
.pop.wide { width: 324px; }
.pop h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
.pop h4 { margin: 4px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
.pop p.hint { margin: 0; font-size: 12px; color: var(--fg-2); max-width: 280px; }
/* On narrow screens, popovers become bottom sheets with thumb-sized controls. */
.pop.sheet { left: max(16px, env(safe-area-inset-left, 0px)) !important; right: max(16px, env(safe-area-inset-right, 0px)); top: auto !important; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); width: auto !important; max-height: 55%; transform: none !important; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.sw i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; min-height: 44px; }
.toggle { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.opt { text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.opt small { color: var(--fg-2); font-size: 12px; }
.opt[aria-pressed="true"] { background: var(--accent-soft); }
.opt:hover { background: var(--chrome-2); }
.kinds { display: grid; grid-template-columns: repeat(4, 64px); gap: 4px; }
.kind { height: 64px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--fg-2); }
.kind:hover { background: var(--chrome-2); color: var(--fg); }
.kind[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.preset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; min-height: 64px; }
.preset:hover { border-color: var(--accent); }
.preset i { width: 28px; height: 20px; border-radius: 5px; background: var(--tile); border: 1px solid var(--line); }
.preset.soft i { box-shadow: 0 2px 5px rgba(16,18,40,.25); border-color: transparent; }
.preset.lifted i { box-shadow: 0 6px 12px rgba(16,18,40,.35); border-color: transparent; }
.preset.glass i { background: linear-gradient(135deg, #8f97ff, #f2b45a); border-color: rgba(255,255,255,.8); }
.fx-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 40px; align-items: center; gap: 8px; min-height: 40px; font-size: 13px; }
.fx-row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); font-size: 12px; }
.fx-row input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--chrome-2); border-radius: 9px; padding: 2px; gap: 2px; }
.fx-row .seg { grid-column: 2 / 4; }
.seg button { height: 32px; border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--fg-2); padding: 0; }
.seg button[aria-pressed="true"] { background: var(--chrome); color: var(--fg); box-shadow: 0 1px 2px var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { min-width: 40px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chipb[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.icons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.icons.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ib { height: 54px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--fg-2); }
.ib:hover:not(:disabled) { background: var(--chrome-2); color: var(--fg); }
.ib:disabled { opacity: 0.3; cursor: default; }
.xywh { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.xywh label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: var(--fg-2); }
.xywh input { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--chrome-2); color: var(--fg); font: inherit; font-size: 14px; padding: 0 6px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 36px; border-radius: 8px; background: var(--chrome-2); font-size: 18px; }
.stepper output { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Insert library */
#insertPop {
  left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  width: min(620px, calc(100vw - 32px)); max-height: calc(100% - 190px); padding: 0; gap: 0; overflow: hidden;
}
.lib-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--chrome-2); color: var(--fg-2); }
.search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; color: var(--fg); outline: none; -webkit-user-select: text; user-select: text; }
.lib-body { overflow-y: auto; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain; }
.lib-body h3 { margin: 12px 0 6px; }
.lib-body > p.hint { margin: 10px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 1px solid transparent; text-align: left; }
.tile:hover { border-color: var(--line); background: var(--chrome-2); }
.tile canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; background: var(--tile); display: block; max-width: 100%; }
.tile span { font-size: 12px; font-weight: 600; padding: 0 2px; }
.tile .rm { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; padding: 0; border-radius: 50%; background: var(--chrome); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; color: var(--fg-2); }
.empty { padding: 24px 0; text-align: center; color: var(--fg-2); font-size: 14px; }

/* Layers panel */
#layers {
  position: fixed; z-index: 6; display: flex; flex-direction: column; overflow: hidden;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 76px); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  width: min(288px, calc(100vw - 32px));
}
.lay-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); }
.lay-head b { font-size: 14px; }
#layerList { overflow-y: auto; padding: 4px 6px 10px; display: flex; flex-direction: column; gap: 1px; overscroll-behavior: contain; }
.layer { display: grid; grid-template-columns: 26px 20px minmax(0, 1fr) 34px 34px; align-items: center; gap: 4px; min-height: 40px; border-radius: 8px; font-size: 13px; cursor: default; }
.layer:hover { background: var(--chrome-2); }
.layer.on { background: var(--accent-soft); color: var(--accent); }
.layer.off .name, .layer.off svg.s { opacity: 0.4; }
.layer .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .name input { width: 100%; font: inherit; border: 1px solid var(--accent); border-radius: 6px; padding: 2px 4px; background: var(--chrome); color: var(--fg); -webkit-user-select: text; user-select: text; }
.layer .grip { height: 40px; display: grid; place-items: center; color: var(--fg-2); cursor: grab; touch-action: none; }
.layer .mini { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--fg-2); opacity: 0.55; }
.layer .mini[aria-pressed="true"] { opacity: 1; color: var(--accent); }
.layer:hover .mini { opacity: 1; }
.layer.frame { grid-template-columns: 20px minmax(0, 1fr); padding-left: 8px; font-weight: 600; margin-top: 8px; }
.layer.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
.layer.drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
.lay-section { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); padding: 12px 8px 4px; font-weight: 600; }
.lay-empty { color: var(--fg-2); font-size: 12px; padding: 12px 8px 0; margin: 0; }

/* Selection bar */
#ctx { position: fixed; z-index: 6; display: flex; align-items: center; gap: 2px; padding: 4px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
#ctx::-webkit-scrollbar { display: none; }
#ctx .swatches { flex-wrap: nowrap; gap: 0; }
#ctx .sw { width: 34px; height: 34px; }
#ctx .sw i { width: 20px; height: 20px; }
#ctx .btn { min-width: 40px; height: 40px; padding: 0 8px; }
#ctx .danger { color: var(--danger); }

/* Toast */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 7;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
  font-size: 14px; width: max-content; max-width: calc(100vw - 32px); background: var(--fg); color: var(--chrome); border-color: transparent;
}
#toast span { min-width: 0; }
#toast button { color: var(--chrome); font-weight: 600; padding: 8px 12px; border-radius: 9px; background: rgba(127,127,127,0.25); white-space: nowrap; }

/* Text editor overlay */
#editor {
  position: fixed; z-index: 4; margin: 0; padding: 0; border: 0; outline: 1.5px solid var(--accent); outline-offset: 4px;
  background: transparent; resize: none; overflow: hidden; white-space: pre; line-height: 1.25;
  font-family: var(--ui); -webkit-user-select: text; user-select: text;
}

/* New design sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 20; background: rgba(15, 16, 30, 0.35); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#sheet { width: min(640px, 100%); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
#sheet h2 { margin: 0; font-size: 22px; text-wrap: balance; }
#sheet p { margin: 0; color: var(--fg-2); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 150px; justify-content: flex-end; }
.card:hover { border-color: var(--accent); background: var(--accent-soft); }
.card .shape { background: var(--chrome-2); border: 1.5px solid var(--fg-2); border-radius: 6px; max-width: 100%; }
.card b { font-size: 14px; }
.card small { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.sheet-foot { display: flex; justify-content: flex-end; }

@media (max-width: 560px) {
  .tool { width: 52px; font-size: 10px; }
  .doc span, #layersBtn span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toggle::after { transition: none; } }
</style>

<canvas id="scene" aria-label="Design canvas"></canvas>

<header id="top">
  <div class="bar group">
    <button class="btn" id="newBtn" title="New design" aria-label="New design">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg>
    </button>
    <div class="doc"><b>Chitrakar</b><span id="docName">Example</span></div>
  </div>
  <div class="bar group">
    <button class="btn" id="undoBtn" title="Undo (⌘Z · two-finger tap)" aria-label="Undo">
      <svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="btn" id="redoBtn" title="Redo (⇧⌘Z · three-finger tap)" aria-label="Redo">
      <svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
  </div>
  <div class="bar group">
    <button class="chip" id="pencilChip" hidden aria-label="Apple Pencil settings">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="m14 7 3 3"/></svg>Pencil
    </button>
    <button class="btn label" id="layersBtn" title="Layers" aria-expanded="false">
      <svg class="i" viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></svg><span>Layers</span>
    </button>
    <button class="btn" id="zoom" title="Zoom to fit (⌘0)" aria-label="Zoom to fit">100%</button>
  </div>
</header>

<nav id="dock" class="bar" aria-label="Tools">
  <button class="tool" data-tool="select" title="Select (V)">
    <svg class="i" viewBox="0 0 24 24"><path d="M6 3.5 19 11l-5.6 1.6L10.6 18z"/></svg>Select
  </button>
  <button class="tool" data-tool="draw" title="Draw (P)">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="m14 7 3 3"/></svg>Draw
  </button>
  <button class="tool" data-tool="shape" id="shapeBtn" title="Shapes (R, O, L)">
    <svg class="i" viewBox="0 0 24 24" id="shapeIcon"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>Shapes
  </button>
  <button class="tool" id="insertBtn" title="Insert UI components (I)" aria-expanded="false">
    <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="3.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 13.5v7M13.5 17h7"/></svg>Insert
  </button>
  <button class="tool" data-tool="text" title="Text (T)">
    <svg class="i" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>Text
  </button>
  <button class="tool" data-tool="frame" title="Frame (F)">
    <svg class="i" viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg>Frame
  </button>
  <button class="tool" data-tool="erase" title="Erase (E)">
    <svg class="i" viewBox="0 0 24 24"><path d="M9 20h11"/><path d="m4.5 14.5 9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 17H7z"/></svg>Erase
  </button>
  <span class="sep"></span>
  <button class="tool" id="colorBtn" title="Color and drawing options" aria-label="Color and drawing options">
    <span class="dot" id="colorDot"></span>Color
  </button>
</nav>

<div id="colorPop" class="bar pop" hidden>
  <h3>Color</h3>
  <div class="swatches" id="toolSwatches"></div>
  <div class="row">
    <span>Turn rough drawings into clean shapes</span>
    <button class="toggle" id="autoShape" role="switch" aria-checked="true" aria-label="Turn rough drawings into clean shapes"></button>
  </div>
</div>
<div id="shapePop" class="bar pop" hidden>
  <h3>Shapes</h3>
  <div class="kinds" id="kinds"></div>
  <p class="hint">Drag on the canvas to draw. Tap to drop one. Hold Shift for a perfect square or circle.</p>

    ctx.fillStyle = T.tile; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const pad = 12, s = Math.min((tw - pad * 2) / Math.max(node.w, 1), (th - pad * 2) / Math.max(node.h, 1), 2.5);
    const ox = (tw - node.w * s) / 2 - node.x * s, oy = (th - node.h * s) / 2 - node.y * s;
    if (glassBg) {
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.fillStyle = '#8f97ff'; ctx.beginPath(); ctx.arc(tw * 0.32, th * 0.42, th * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2b45a'; ctx.beginPath(); ctx.arc(tw * 0.68, th * 0.6, th * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.setTransform(d * s, 0, 0, d * s, d * ox, d * oy);
    drawItem(node);
    ctx = prev;
  }
  function buildLibrary() {
    const body = $('libBody'); body.replaceChildren();
    const sections = [
      ...(myLib.length ? [{ cat: 'My components', mine: true, items: myLib.map((c) => [c.name, () => reid(clone(c.node))]) }] : []),
      ...LIB,
    ];
    if (!myLib.length) body.append(h('p', { class: 'hint' }, 'Tip: group anything you build and tap Save in the selection bar to reuse it here.'));
    for (const sec of sections) {
      const grid = h('div', { class: 'tiles' });
      sec.items.forEach(([name, make], idx) => {
        const c = h('canvas', { 'aria-hidden': 'true' });
        const b = h('button', { class: 'tile', 'data-q': (name + ' ' + sec.cat).toLowerCase(), onclick: () => insertNode(make(), name) }, c, h('span', {}, name));
        if (sec.mine) b.append(h('span', { class: 'rm', role: 'button', 'aria-label': `Remove ${name}`, html: svg('<path d="M6 6l12 12M18 6 6 18"/>', 's'),
          onclick: (e) => { e.stopPropagation(); myLib.splice(idx, 1); store.set(myLib, LIBKEY); buildLibrary(); } }));
        grid.append(b);
        thumb(c, make(), sec.glass && name !== 'Soft glow');
      });
      body.append(h('section', {}, h('h3', {}, sec.cat), grid));
    }
    body.append(h('p', { class: 'empty', id: 'libEmpty', hidden: true }, 'Nothing matches. Try “button”, “card” or “bar”.'));
    libBuilt = true; filterLib();
  }
  function filterLib() {
    const q = $('libSearch').value.trim().toLowerCase(); let any = false;
    $('libBody').querySelectorAll('section').forEach((sec) => {
      let shown = 0;
      sec.querySelectorAll('.tile').forEach((t) => { const ok = !q || t.dataset.q.includes(q); t.hidden = !ok; if (ok) shown++; });
      sec.hidden = !shown; if (shown) any = true;
    });
    $('libEmpty').hidden = any;
  }
  $('libSearch').addEventListener('input', filterLib);
  function toggleInsert(forceOpen) {
    const open = !$('insertPop').hidden; closePops(); if (open && !forceOpen) return;
    if (!libBuilt) buildLibrary();
    hideToast();
    $('insertPop').hidden = false; $('insertBtn').setAttribute('aria-expanded', 'true');
  }
  $('insertBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleInsert(); });
  $('libClose').addEventListener('click', closePops);
  function insertNode(n, name) {
    checkpoint();
    const c = toWorld((W - panelW()) / 2, (H - 20) / 2);
    let x = Math.round(c.x - n.w / 2), y = Math.round(c.y - n.h / 2);
    if (lastInsert && Math.abs(lastInsert.x - x) < 2 && Math.abs(lastInsert.y - y) < 2) { x = lastInsert.nx + 24; y = lastInsert.ny + 24; }
    lastInsert = { x: Math.round(c.x - n.w / 2), y: Math.round(c.y - n.h / 2), nx: x, ny: y };
    if (n.type === 'line') setLineEnds(n, lineEnds(n).map(([px, py]) => [px - n.x + x, py - n.y + y])); else { n.x = x; n.y = y; }
    S.nodes.push(n); closePops(); setTool('select'); S.sel = new Set([n.id]); changed();
    toast(n.type === 'group' ? `Added ${name}. Drag to move it. Double-tap a part to edit it.` : `Added ${name}.`, null, null, 3500);
  }

  // ---------- Layers panel ----------
  function layerName(n) {
    if (n.name) return n.name;
    if (n.type === 'text') return n.text.split('\n')[0].slice(0, 32) || 'Text';
    if (n.type === 'icon') return (ICON_LABEL[n.icon] || 'Icon') + ' icon';
    if (n.type === 'polygon') return n.sides === 4 ? 'Diamond' : 'Polygon';
    if (n.type === 'line') return n.head ? 'Arrow' : 'Line';
    return { rect: 'Rectangle', ellipse: 'Ellipse', stroke: 'Drawing', triangle: 'Triangle', star: 'Star', image: 'Image', group: 'Group', frame: 'Frame' }[n.type] || n.type;
  }
  let drag = null;
  function buildLayers() {
    const list = $('layerList'); if ($('layers').hidden) return;
    const st = list.scrollTop;
    const frames = S.nodes.filter((n) => n.type === 'frame');
    const groups = new Map(frames.map((f) => [f, []])), loose = [];
    for (let i = S.nodes.length - 1; i >= 0; i--) { const n = S.nodes[i]; if (n.type === 'frame') continue; const f = frameOf(n); (f ? groups.get(f) : loose).push(n); }
    const row = (n, child) => {
      const name = h('span', { class: 'name' }, layerName(n));
      name.addEventListener('dblclick', (e) => { e.stopPropagation(); renameRow(n, name); });
      const el = h('div', { class: 'layer' + (S.sel.has(n.id) ? ' on' : '') + (n.hidden ? ' off' : '') + (child ? '' : ' frame'), 'data-id': n.id,
        onclick: (e) => { if (e.target.closest('button,.grip,input')) return; S.sel = new Set([n.id]); if (S.tool !== 'select' && S.tool !== 'draw') setTool('select'); reveal(n); updateUI(); requestRender(); } });
      if (child) {
        const grip = h('span', { class: 'grip', 'aria-label': 'Drag to reorder', html: svg('<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/>', 's') });
        grip.addEventListener('pointerdown', (e) => { e.preventDefault(); drag = { id: n.id }; try { layerList.setPointerCapture(e.pointerId); } catch { /* ignore */ } });
        el.append(grip);
      }
      el.append(h('span', { html: svg(TYPE_ICON[n.type] || TYPE_ICON.rect, 's') }), name);
      if (child) {
        el.append(
          h('button', { class: 'mini', 'aria-label': n.hidden ? 'Show' : 'Hide', 'aria-pressed': String(!!n.hidden), title: n.hidden ? 'Show' : 'Hide',
            html: svg(n.hidden ? '<path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.6M6.4 7.6A16 16 0 0 0 2.5 12S6 18 12 18a9 9 0 0 0 4-.9"/>' : '<path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/>', 's'),
            onclick: () => { checkpoint(); n.hidden = !n.hidden; if (n.hidden) S.sel.delete(n.id); changed(); } }),
          h('button', { class: 'mini', 'aria-label': n.locked ? 'Unlock' : 'Lock', 'aria-pressed': String(!!n.locked), title: n.locked ? 'Unlock' : 'Lock',
            html: svg(n.locked ? '<path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>' : '<path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2"/>', 's'),
            onclick: () => { checkpoint(); n.locked = !n.locked; changed(); } }));
      }
      return el;
    };
    const out = [];
    for (let i = frames.length - 1; i >= 0; i--) { const f = frames[i]; out.push(row(f, false)); for (const n of groups.get(f)) out.push(row(n, true)); }
    if (loose.length) { out.push(h('div', { class: 'lay-section' }, frames.length ? 'Not in a frame' : 'Canvas')); for (const n of loose) out.push(row(n, true)); }
    if (!S.nodes.length) out.push(h('p', { class: 'lay-empty' }, 'Nothing here yet. Draw something or tap Insert.'));
    out.push(h('p', { class: 'lay-empty' }, 'Top of the list is in front. Drag ⋮⋮ to reorder. Double-click a name to rename.'));
    list.replaceChildren(...out); list.scrollTop = st;
  }
  function renameRow(n, span) {
    const inp = h('input', { value: layerName(n), 'aria-label': 'Layer name' });
    span.replaceChildren(inp); inp.focus(); inp.select();
    const done = () => { const v = inp.value.trim(); if (v && v !== layerName(n)) { checkpoint(); n.name = v; changed(); } else buildLayers(); };
    inp.addEventListener('blur', done);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = layerName(n); inp.blur(); } });
  }
  const layerList = $('layerList');
  layerList.addEventListener('pointermove', (e) => {
    if (!drag) return;
    layerList.querySelectorAll('.drop-above,.drop-below').forEach((r) => r.classList.remove('drop-above', 'drop-below'));
    const r = document.elementFromPoint(e.clientX, e.clientY)?.closest('.layer[data-id]');
    if (!r || r.dataset.id === drag.id || r.classList.contains('frame')) { drag.target = null; return; }
    const b = r.getBoundingClientRect(), above = e.clientY < b.top + b.height / 2;
    r.classList.add(above ? 'drop-above' : 'drop-below'); drag.target = { id: r.dataset.id, above };
  });
  const endDrag = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.target) moveZ(d.id, d.target.id, d.target.above); else buildLayers();   // higher in the list = further in front
  };
  layerList.addEventListener('pointerup', endDrag); layerList.addEventListener('pointercancel', endDrag);
  function toggleLayers() {
    const p = $('layers'); p.hidden = !p.hidden; $('layersBtn').setAttribute('aria-expanded', String(!p.hidden)); buildLayers(); requestRender();
  }
  $('layersBtn').addEventListener('click', toggleLayers);
  $('layersClose').addEventListener('click', toggleLayers);

  // ---------- Selection bar ----------
  const ctxBar = $('ctx');
  function buildContextBar() {
    const nodes = selected(), items = nodes.filter((n) => n.type !== 'frame');
    const frag = document.createDocumentFragment();
    const btn = (label, d, fn, extra = '', text) => {
      const b = h('button', { class: 'btn ' + (text ? 'label ' : '') + extra, title: label, 'aria-label': label, html: svg(d) + (text ? `<span>${text}</span>` : '') });
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(b); }); frag.append(b); return b;
    };
    if (items.length) {
      frag.append(h('div', { class: 'swatches' }, swatchButtons(colorOf(items[0]), (c) => { checkpoint(); for (const n of fxNodes()) setColor(n, c); changed(); refreshSelPop(); })),
        h('span', { class: 'sep' }));
      if (items.some((n) => fxTarget(n) || ['line', 'stroke', 'icon', 'image'].includes(n.type)))
        btn('Style: fill, border, corners', '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>', (b) => openSelPop('stylePop', b, buildStyle), '', 'Style');
      if (items.some((n) => n.type === 'text'))
        btn('Text size and weight', '<path d="M4 18 9 6l5 12M5.8 14h6.4M16 12h5M18.5 9.5v5"/>', (b) => openSelPop('textPop', b, buildText), '', 'Text');
      btn('Effects: shadow, blur, opacity', '<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>', (b) => openSelPop('fxPop', b, buildFx), '', 'Effects');
    }
    btn('Arrange: order, align, position', '<rect x="4" y="4" width="9" height="9" rx="1.5"/><rect x="11" y="11" width="9" height="9" rx="1.5" fill="currentColor" stroke="none" opacity=".35"/>', (b) => openSelPop('arrangePop', b, buildArrange), '', 'Arrange');
    if (items.some((n) => n.type === 'group')) {
      btn('Ungroup (⇧⌘G)', '<rect x="3.5" y="3.5" width="8" height="8" rx="1.5"/><rect x="12.5" y="12.5" width="8" height="8" rx="1.5"/>', ungroup, '', 'Ungroup');
      if (items.length === 1) btn('Save to Insert → My components', '<path d="M6 4h12v16l-6-4-6 4z"/>', saveComponent, '', 'Save');
    } else if (items.length > 1) {
      btn('Group (⌘G)', '<rect x="3.5" y="3.5" width="17" height="17" rx="2" stroke-dasharray="3 3"/><rect x="7" y="7" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>', groupSel, '', 'Group');
    }
    btn('Duplicate (⌘D)', '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>', dup);
    btn('Delete', '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', del, 'danger');
    ctxBar.replaceChildren(frag);
    if (openSel) { const b = [...ctxBar.querySelectorAll('button')].find((x) => x.getAttribute('aria-label') === openSel.label); if (b) b.setAttribute('aria-expanded', 'true'); }
  }
  function placeContextBar() {
    const show = S.sel.size && !G && !editing && !pinch;
    if (!show) { ctxBar.hidden = true; return; }
    const ns = selected(); if (!ns.length) { ctxBar.hidden = true; return; }
    const u = union(ns), a = toScreen(u.x, u.y), b = toScreen(u.x + u.w, u.y + u.h);
    ctxBar.hidden = false;
    const r = ctxBar.getBoundingClientRect(), right = W - panelW();
    let left = (a.x + b.x) / 2 - r.width / 2, top = a.y - r.height - 18;
    if (top < 76) top = b.y + 18;
    if (top + r.height > H - 96) top = Math.max(76, H - 96 - r.height);
    left = Math.min(Math.max(16, left), Math.max(16, right - r.width - 16));
    ctxBar.style.left = left + 'px'; ctxBar.style.top = top + 'px';
  }

  // Toast
  let toastTimer = 0;
  function toast(msg, actLabel, act, ms = 4000) {
    $('toastMsg').textContent = msg;
    const b = $('toastAct'); b.hidden = !actLabel; b.textContent = actLabel || '';
    b.onclick = () => { hideToast(); act && act(); };
    $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms);
  }
  function hideToast() { $('toast').hidden = true; clearTimeout(toastTimer); }

  function updateZoomLabel() { $('zoom').textContent = Math.round(S.cam.z * 100) + '%'; }
  let lastSelKey = '';
  function updateUI() {
    for (const id of [...S.sel]) { const n = byId(id); if (!n || n.hidden) S.sel.delete(id); }
    dock.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === S.tool)));
    $('colorDot').style.background = S.color;
    $('autoShape').setAttribute('aria-checked', String(S.autoShape));
    $('undoBtn').disabled = !past.length; $('redoBtn').disabled = !future.length;
    $('pencilChip').hidden = !S.pencil;
    $('pencilPop').querySelectorAll('[data-finger]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.finger === S.finger)));
    const key = [...S.sel].join(',') + '|' + selected().map((n) => `${n.type}${colorOf(n)}${n.locked}`).join(',');
    if (key !== lastSelKey) { lastSelKey = key; if (S.sel.size) buildContextBar(); }
    if (!S.sel.size && openSel) closePops();
    updateZoomLabel(); buildLayers();
  }

  // New design sheet
  const cards = $('cards');
  cards.replaceChildren(...PRESETS.map((p) => {
    const s = h('span', { class: 'shape' });
    const k = p.w ? 70 / Math.max(p.w, p.h) : 0;
    Object.assign(s.style, p.w ? { width: p.w * k + 'px', height: p.h * k + 'px' } : { width: '60px', height: '44px', borderStyle: 'dashed' });
    return h('button', { class: 'card', onclick: () => {
      checkpoint();
      S.nodes = []; S.sel.clear();
      if (p.w) S.nodes.push({ id: nid(), type: 'frame', x: 0, y: 0, w: p.w, h: p.h, name: p.name });
      $('docName').textContent = p.name + ' design';
      $('sheetWrap').hidden = true; setTool('draw'); fit(S.nodes); changed();
      toast(`New ${p.name === 'Blank' ? 'blank canvas' : p.name + ' design'}. Undo brings back the previous one.`, 'Undo', undo);
    } }, s, h('b', {}, p.name), h('small', {}, p.w ? `${p.w} × ${p.h}` : 'Infinite canvas'));
  }));
  $('newBtn').addEventListener('click', () => { closePops(); $('sheetWrap').hidden = false; cards.firstChild.focus(); });
  $('sheetCancel').addEventListener('click', () => { $('sheetWrap').hidden = true; });
  $('sheetWrap').addEventListener('pointerdown', (e) => { if (e.target === $('sheetWrap')) $('sheetWrap').hidden = true; });

  // ---------- Example document (marked as an example in the doc name) ----------
  const make = (name) => { for (const s of LIB) for (const [n, f] of s.items) if (n === name) return f(); return null; };
  const place = (N, name, x, y) => { const n = make(name); n.x = x; n.y = y; N.push(n); return n; };
  function sample() {
    const N = [];
    const text = (x, y, t, size, weight, color) => { const n = Tx(t, size, weight, color, { x, y }); N.push(n); return n; };
    N.push({ id: nid(), type: 'frame', x: 0, y: 0, w: 393, h: 852, name: 'Sign in' });
    place(N, 'Status bar', 0, 0);
    text(24, 112, 'Welcome back', 32, 700, INK);
    text(24, 158, 'Sign in to keep designing.', 16, 400, '#5e6174');
    const email = place(N, 'Text field', 24, 196); email.w = 345; email.h = 70 * 345 / 320;
    const pass = place(N, 'Password field', 24, 292); pass.w = 345; pass.h = 48 * 345 / 320;
    N.push(R(24, 370, 345, 56, { r: 14, fill: AC, shadow: 1, name: 'Sign in button' }));
    const t = text(0, 388, 'Sign in', 17, 600, WH); t.x = 24 + (345 - t.w) / 2; t.align = 'center';
    const f = text(0, 450, 'Forgot password?', 15, 500, AC); f.x = 24 + (345 - f.w) / 2; f.align = 'center';
    const ink = (fn, steps, color, sw) => {
      const pts = []; for (let i = 0; i <= steps; i++) { const u = i / steps, [x, y] = fn(u); pts.push(x, y, 0.35 + 0.45 * Math.sin(Math.PI * u)); }
      N.push(makeStroke(pts, true, sw, color));
    };
    ink((u) => [612 - 230 * u + 8 * Math.sin(u * 6), 306 + 92 * u * u], 40, RED, 2.6);
    ink((u) => [382 + 18 * u, 398 - 16 * u], 6, RED, 2.6);
    ink((u) => [382 + 20 * u, 398 + 10 * u], 6, RED, 2.6);
    text(470, 260, 'Taller button?', 22, 500, RED);
    N.push({ id: nid(), type: 'frame', x: 720, y: 0, w: 393, h: 852, name: 'Home (sketch)' });
    const jag = (x, y, w, h) => ink((u) => {
      const s = u * 4, k = Math.floor(s) % 4, f2 = s - Math.floor(s), j = Math.sin(u * 40) * 1.4;
      return [[x + w * f2, y + j], [x + w + j, y + h * f2], [x + w * (1 - f2), y + h + j], [x + j, y + h * (1 - f2)]][k];
    }, 80, INK, 2.2);
    jag(744, 96, 345, 180);
    ink((u) => [744 + 220 * u, 312 + Math.sin(u * 22) * 3], 40, INK, 2.4);
    ink((u) => [744 + 150 * u, 340 + Math.sin(u * 18) * 3], 30, INK, 2.4);
    jag(744, 380, 165, 120); jag(924, 380, 165, 120);
    const X = 1440;
    N.push({ id: nid(), type: 'frame', x: X, y: 0, w: 393, h: 852, name: 'Components' });
    place(N, 'Status bar', X, 0);
    text(X + 20, 64, 'Discover', 34, 700, INK);
    N.push({ ...E(X + 40, 140, 190, 190, { fill: '#8f97ff', blur: 22 }), name: 'Blue glow' });
    N.push({ ...E(X + 170, 210, 180, 180, { fill: '#f2b45a', blur: 22 }), name: 'Amber glow' });
    place(N, 'Glass card', X + 46, 196);
    place(N, 'Segmented control', X + 46, 420);
    place(N, 'List item', X + 16, 480);
    place(N, 'Settings row', X + 16, 560);
    place(N, 'Button', X + 116, 640);
    place(N, 'Tab bar', X, 852 - 83);
    return N;
  }

  // ---------- Boot ----------
  readTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); libBuilt = false; requestRender(); });
  new MutationObserver(() => { readTheme(); libBuilt = false; requestRender(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } if (saveTimer) flush(); }
    else requestRender();
  });
  resize();
  const saved = store.get();
  if (saved && Array.isArray(saved.nodes)) {
    Object.assign(S, {
      nodes: saved.nodes, cam: saved.cam || S.cam, color: saved.color || S.color, autoShape: saved.autoShape !== false,
      pencil: !!saved.pencil, finger: saved.finger || 'move',
      tips: saved.tips || { coach: saved.coachSeen ? 1 : 0, glass: saved.glassTipSeen ? 1 : 0 },
    });
    if (saved.shapeKind) pickShape(saved.shapeKind);
    $('docName').textContent = saved.nodes.length ? 'Your design' : 'Blank canvas';
    setTool('draw');
  } else {
    S.nodes = sample();
    $('docName').textContent = 'Example';
    fit(S.nodes);
  }
  updateUI(); requestRender();
  if (!S.tips.coach) {
    setTimeout(() => toast('Draw with your finger, mouse or Apple Pencil. Tap Insert for ready-made buttons, cards and bars.', 'Got it', null, 9000), 500);
    S.tips.coach = 1; save();
  }
  window.chitrakar = { state: S };        // for automated tests
})();
</script>
