<title>Chitrakar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed paper canvas; thin chrome floats at the edges (top bar, bottom tool dock, contextual bar beside the selection). */
:root {
  --chrome: #ffffff;
  --chrome-2: #f1f1f6;
  --line: #dcdde7;
  --fg: #1b1c26;
  --fg-2: #5e6174;
  --accent: #3d47c9;
  --accent-soft: #e6e8fb;
  --accent-fg: #ffffff;
  --canvas: #e9e9ef;
  --dot: #c6c7d4;
  --danger: #c8322b;
  --shadow: rgba(22, 24, 48, 0.10);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #1e1f27; --chrome-2: #2a2b35; --line: #393b49; --fg: #ececf3; --fg-2: #a4a7b9;
    --accent: #8f97ff; --accent-soft: #2d3060; --accent-fg: #12132a;
    --canvas: #d9d9e0; --dot: #b6b7c5; --danger: #ff7a72; --shadow: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #1e1f27; --chrome-2: #2a2b35; --line: #393b49; --fg: #ececf3; --fg-2: #a4a7b9;
  --accent: #8f97ff; --accent-soft: #2d3060; --accent-fg: #12132a;
  --canvas: #d9d9e0; --dot: #b6b7c5; --danger: #ff7a72; --shadow: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--canvas); color: var(--fg); font-family: var(--ui);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#scene.panning { cursor: grabbing; }
#scene.space { cursor: grab; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.bar {
  background: var(--chrome); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 1px 2px var(--shadow), 0 6px 16px var(--shadow);
}

/* Top bar */
#top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#top > * { pointer-events: auto; }
.group { display: flex; align-items: center; gap: 2px; padding: 4px; }
.btn { min-width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; }
.btn:hover { background: var(--chrome-2); }
.btn:disabled { opacity: 0.35; cursor: default; background: none; }
.doc { display: flex; flex-direction: column; line-height: 1.15; padding: 0 10px 0 4px; }
.doc b { font-size: 15px; font-weight: 600; }
.doc span { font-size: 12px; color: var(--fg-2); }
.chip { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.chip svg.i { width: 16px; height: 16px; }
#zoom { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; min-width: 64px; }

/* Bottom dock */
#dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 2px; padding: 6px;
  max-width: calc(100vw - 32px);
}
.tool { width: 64px; height: 56px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--fg-2); }
.tool:hover { background: var(--chrome-2); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.sep { width: 1px; height: 32px; background: var(--line); margin: 0 4px; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--chrome); box-shadow: 0 0 0 1px var(--line); }

/* Popovers & context bar */
.pop { position: fixed; z-index: 8; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 220px; max-width: calc(100vw - 32px); }
.pop h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.sw i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; min-height: 44px; }
.toggle { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.opt { text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.opt small { color: var(--fg-2); font-size: 12px; }
.opt[aria-pressed="true"] { background: var(--accent-soft); }
.opt:hover { background: var(--chrome-2); }

#ctx { position: fixed; z-index: 6; display: flex; align-items: center; gap: 2px; padding: 4px; }
#ctx .sw { width: 34px; height: 34px; }
#ctx .sw i { width: 20px; height: 20px; }
#ctx .btn { min-width: 40px; height: 40px; padding: 0 8px; }
#ctx .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
#ctx .danger { color: var(--danger); }

/* Toast */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 7;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
  font-size: 14px; width: max-content; max-width: calc(100vw - 32px); background: var(--fg); color: var(--chrome); border-color: transparent;
}
#toast span { min-width: 0; }
#toast button { color: var(--chrome); font-weight: 600; padding: 8px 12px; border-radius: 9px; background: rgba(127,127,127,0.25); white-space: nowrap; }

/* Text editor overlay */
#editor {
  position: fixed; z-index: 4; margin: 0; padding: 0; border: 0; outline: 1.5px solid var(--accent); outline-offset: 4px;
  background: transparent; resize: none; overflow: hidden; white-space: pre; line-height: 1.25;
  font-family: var(--ui); -webkit-user-select: text; user-select: text;
}

/* New design sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 20; background: rgba(15, 16, 30, 0.35); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#sheet { width: min(640px, 100%); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
#sheet h2 { margin: 0; font-size: 22px; text-wrap: balance; }
#sheet p { margin: 0; color: var(--fg-2); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 150px; justify-content: flex-end; }
.card:hover { border-color: var(--accent); background: var(--accent-soft); }
.card .shape { background: var(--chrome-2); border: 1.5px solid var(--fg-2); border-radius: 6px; max-width: 100%; }
.card b { font-size: 14px; }
.card small { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.sheet-foot { display: flex; justify-content: flex-end; }

@media (max-width: 520px) {
  .tool { width: 52px; font-size: 10px; }
  .doc span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toggle::after { transition: none; } }
</style>

<canvas id="scene" aria-label="Design canvas"></canvas>

<header id="top">
  <div class="bar group">
    <button class="btn" id="newBtn" title="New design" aria-label="New design">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg>
    </button>
    <div class="doc"><b>Chitrakar</b><span id="docName">Login flow</span></div>
  </div>
  <div class="bar group">
    <button class="btn" id="undoBtn" title="Undo (⌘Z · two-finger tap)" aria-label="Undo">
      <svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="btn" id="redoBtn" title="Redo (⇧⌘Z · three-finger tap)" aria-label="Redo">
      <svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
  </div>
  <div class="bar group">
    <button class="chip" id="pencilChip" hidden aria-label="Apple Pencil settings">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="m14 7 3 3"/></svg>Pencil
    </button>
    <button class="btn" id="zoom" title="Zoom to fit (⌘0)" aria-label="Zoom to fit">100%</button>
  </div>
</header>

<nav id="dock" class="bar" aria-label="Tools">
  <button class="tool" data-tool="select" title="Select (V)">
    <svg class="i" viewBox="0 0 24 24"><path d="M6 3.5 19 11l-5.6 1.6L10.6 18z"/></svg>Select
  </button>
  <button class="tool" data-tool="draw" title="Draw (P)">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="m14 7 3 3"/></svg>Draw
  </button>
  <button class="tool" data-tool="text" title="Text (T)">
    <svg class="i" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>Text
  </button>
  <button class="tool" data-tool="frame" title="Frame (F)">
    <svg class="i" viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg>Frame
  </button>
  <button class="tool" data-tool="erase" title="Erase (E)">
    <svg class="i" viewBox="0 0 24 24"><path d="M9 20h11"/><path d="m4.5 14.5 9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 17H7z"/></svg>Erase
  </button>
  <span class="sep"></span>
  <button class="tool" id="colorBtn" title="Color and drawing options" aria-label="Color and drawing options">
    <span class="dot" id="colorDot"></span>Color
  </button>
</nav>

<div id="colorPop" class="bar pop" hidden>
  <h3>Color</h3>
  <div class="swatches" id="toolSwatches"></div>
  <div class="row">
    <span>Turn rough shapes into clean ones</span>
    <button class="toggle" id="autoShape" role="switch" aria-checked="true" aria-label="Turn rough shapes into clean ones"></button>
  </div>
</div>

<div id="pencilPop" class="bar pop" hidden>
  <h3>Apple Pencil is active</h3>
  <button class="opt" data-finger="move"><b>Fingers move and select</b><small>The Pencil draws. Recommended.</small></button>
  <button class="opt" data-finger="draw"><b>Fingers draw too</b><small>Use two fingers to move the canvas.</small></button>
</div>

<div id="ctx" class="bar" hidden></div>
<div id="toast" class="bar" hidden role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<textarea id="editor" hidden spellcheck="false" aria-label="Edit text"></textarea>

<div id="sheetWrap" hidden>
  <div id="sheet" class="bar" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">What are you designing?</h2>
    <p>Pick a size to start with. You can draw more frames any time.</p>
    <div class="cards" id="cards"></div>
    <div class="sheet-foot"><button class="btn" id="sheetCancel">Cancel</button></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // ---------- State ----------
  const SWATCHES = ['#1f2233', '#3d47c9', '#d6453d', '#e39a2d', '#2f9e6a', '#ffffff'];
  const PRESETS = [
    { name: 'iPhone', w: 393, h: 852 },
    { name: 'iPad', w: 820, h: 1180 },
    { name: 'Desktop', w: 1440, h: 900 },
    { name: 'Blank', w: 0, h: 0 },
  ];
  const S = {
    nodes: [], sel: new Set(), cam: { x: 0, y: 0, z: 1 },
    tool: 'draw', color: SWATCHES[0], autoShape: true,
    pencil: false, finger: 'move', coachSeen: false, hover: null,
  };
  const KEY = 'chitrakar.prototype.v1';
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };
  const $ = (id) => document.getElementById(id);
  const cv = $('scene'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, T = {};
  let uid = 1;
  const nid = () => 'n' + (uid++) + Math.random().toString(36).slice(2, 6);

  // ---------- Persistence (debounced; flushed when hidden) ----------
  let saveTimer = 0;
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800); }
  function flush() {
    clearTimeout(saveTimer); saveTimer = 0;
    store.set({ nodes: S.nodes, cam: S.cam, color: S.color, autoShape: S.autoShape, pencil: S.pencil, finger: S.finger, coachSeen: S.coachSeen });
  }

  // ---------- History ----------
  const past = [], future = [];
  const snap = () => JSON.stringify(S.nodes);
  function checkpoint() { past.push(snap()); if (past.length > 100) past.shift(); future.length = 0; }
  function undo() { if (!past.length) return; future.push(snap()); S.nodes = JSON.parse(past.pop()); S.sel.clear(); changed(); }
  function redo() { if (!future.length) return; past.push(snap()); S.nodes = JSON.parse(future.pop()); S.sel.clear(); changed(); }
  function changed() { save(); updateUI(); requestRender(); }

  // ---------- Rendering: only when something changed ----------
  let raf = 0;
  function requestRender() { if (!raf && !document.hidden) raf = requestAnimationFrame(render); }
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    T = { canvas: v('--canvas'), dot: v('--dot'), accent: v('--accent'), fg2: v('--fg-2') };
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    requestRender();
  }
  const toWorld = (sx, sy) => ({ x: (sx - S.cam.x) / S.cam.z, y: (sy - S.cam.y) / S.cam.z });
  const toScreen = (wx, wy) => ({ x: wx * S.cam.z + S.cam.x, y: wy * S.cam.z + S.cam.y });

  let G = null;            // active single-pointer gesture
  let editing = null;      // node id being text-edited

  function render() {
    raf = 0;
    const { x, y, z } = S.cam;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = T.canvas; ctx.fillRect(0, 0, W, H);
    // dot grid
    let g = 24; while (g * z < 16) g *= 4;
    const step = g * z, ox = ((x % step) + step) % step, oy = ((y % step) + step) % step;
    ctx.fillStyle = T.dot;
    for (let sx = ox; sx < W; sx += step) for (let sy = oy; sy < H; sy += step) ctx.fillRect(sx - 0.75, sy - 0.75, 1.5, 1.5);

    ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * x, DPR * y);
    const vx0 = -x / z, vy0 = -y / z, vx1 = vx0 + W / z, vy1 = vy0 + H / z;
    const visible = (n) => n.x - 40 < vx1 && n.x + n.w + 40 > vx0 && n.y - 40 < vy1 && n.y + n.h + 40 > vy0;
    for (const n of S.nodes) if (n.type === 'frame' && visible(n)) drawNode(n);
    for (const n of S.nodes) if (n.type !== 'frame' && n.id !== editing && visible(n)) drawNode(n);

    if (G && G.kind === 'draw') drawInk(G.pts, 0, 0, 1, 1, G.sw, S.color, G.pen);
    if (G && G.kind === 'frame') {
      const r = rectOf(G.x0, G.y0, G.x1, G.y1);
      drawNode({ type: 'frame', ...r, name: `${Math.round(r.w)} × ${Math.round(r.h)}` });
    }
    // overlays
    const lw = 1.5 / z;
    ctx.lineWidth = lw; ctx.strokeStyle = T.accent;
    if (S.sel.size && !editing) {
      for (const n of selected()) { ctx.strokeRect(n.x, n.y, n.w, n.h); }
      if (S.sel.size === 1) {
        const n = selected()[0], hs = 9 / z;
        ctx.fillStyle = '#ffffff';
        for (const [hx, hy] of corners(n)) { ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs); ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs); }
      }
    }
    if (G && G.kind === 'marquee') {
      const r = rectOf(G.x0, G.y0, G.x1, G.y1);
      ctx.fillStyle = 'rgba(61,71,201,0.08)'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.strokeRect(r.x, r.y, r.w, r.h);
    }
    if (S.hover && !G && (S.tool === 'draw' || S.tool === 'erase')) {
      ctx.beginPath();
      const rad = S.tool === 'erase' ? 10 / z : 3;
      ctx.arc(S.hover.x, S.hover.y, rad, 0, Math.PI * 2);
      ctx.strokeStyle = S.tool === 'erase' ? T.fg2 : S.color; ctx.lineWidth = 1.5 / z; ctx.stroke();
    }
    placeContextBar();
  }

  const FONT = (n) => `${n.weight || 500} ${n.size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif`;
  function drawNode(n) {
    const z = S.cam.z;
    switch (n.type) {
      case 'frame': {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(n.x, n.y, n.w, n.h);
        ctx.strokeStyle = 'rgba(20,22,40,0.12)'; ctx.lineWidth = 1 / z; ctx.strokeRect(n.x, n.y, n.w, n.h);
        ctx.fillStyle = T.fg2; ctx.font = `600 ${12 / z}px -apple-system, system-ui, sans-serif`; ctx.textBaseline = 'bottom';
        ctx.fillText(n.name, n.x, n.y - 6 / z);
        break;
      }
      case 'rect': case 'ellipse': {
        ctx.beginPath();
        if (n.type === 'rect') ctx.roundRect(n.x, n.y, n.w, n.h, Math.min(n.r || 0, n.w / 2, n.h / 2));
        else ctx.ellipse(n.x + n.w / 2, n.y + n.h / 2, n.w / 2, n.h / 2, 0, 0, Math.PI * 2);
        if (n.fill) { ctx.fillStyle = n.fill; ctx.fill(); }
        if (n.stroke) { ctx.strokeStyle = n.stroke; ctx.lineWidth = n.sw; ctx.stroke(); }
        break;
      }
      case 'line': {
        const sx = n.w / n.pw, sy = n.h / n.ph, p = n.pts;
        ctx.beginPath(); ctx.moveTo(n.x + p[0] * sx, n.y + p[1] * sy); ctx.lineTo(n.x + p[2] * sx, n.y + p[3] * sy);
        ctx.strokeStyle = n.color; ctx.lineWidth = n.sw; ctx.lineCap = 'round'; ctx.stroke();
        break;
      }
      case 'stroke': drawInk(n.pts, n.x, n.y, n.w / n.pw, n.h / n.ph, n.sw, n.color, n.pen); break;
      case 'text': {
        ctx.fillStyle = n.color; ctx.font = FONT(n); ctx.textBaseline = 'top';
        n.text.split('\n').forEach((line, i) => ctx.fillText(line, n.x, n.y + i * n.size * 1.25));
        break;
      }
    }
  }
  // Pressure-aware ink: quadratic segments between midpoints, width from pressure.
  function drawInk(pts, ox, oy, sx, sy, sw, color, pen) {
    const n = pts.length / 3; if (!n) return;
    const X = (i) => ox + pts[i * 3] * sx, Y = (i) => oy + pts[i * 3 + 1] * sy;
    const wd = (i) => pen ? sw * (0.3 + 1.4 * pts[i * 3 + 2]) : sw;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (n === 1) { ctx.beginPath(); ctx.arc(X(0), Y(0), wd(0) / 2, 0, Math.PI * 2); ctx.fill(); return; }
    let px = X(0), py = Y(0), mx = px, my = py;
    for (let i = 1; i < n; i++) {
      const cx = X(i), cy = Y(i), nx = (px + cx) / 2, ny = (py + cy) / 2;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.quadraticCurveTo(px, py, nx, ny);
      ctx.lineWidth = (wd(i - 1) + wd(i)) / 2; ctx.stroke();
      mx = nx; my = ny; px = cx; py = cy;
    }
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(px, py); ctx.stroke();
  }

  // ---------- Geometry ----------
  const rectOf = (x0, y0, x1, y1) => ({ x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) });
  const corners = (n) => [[n.x, n.y], [n.x + n.w, n.y], [n.x, n.y + n.h], [n.x + n.w, n.y + n.h]];
  const selected = () => S.nodes.filter((n) => S.sel.has(n.id));
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;

  function hitNode(n, x, y, tol) {

    if (n.type === 'rect' || n.type === 'text') return true;

    }
    return false;
  }
  function hit(x, y) {
    const tol = 8 / S.cam.z;
    for (let i = S.nodes.length - 1; i >= 0; i--) { const n = S.nodes[i]; if (n.type !== 'frame' && hitNode(n, x, y, tol)) return n; }
    // Frames are picked by their label or edge, so drawing/marquee inside an empty frame still works.
    ctx.font = `600 ${12 / S.cam.z}px -apple-system, system-ui, sans-serif`;
    for (let i = S.nodes.length - 1; i >= 0; i--) {
      const n = S.nodes[i]; if (n.type !== 'frame') continue;
      const lw = ctx.measureText(n.name).width;
      if (x >= n.x && x <= n.x + Math.max(lw, 40 / S.cam.z) && y >= n.y - 22 / S.cam.z && y <= n.y) return n;
      const inside = x >= n.x - tol && x <= n.x + n.w + tol && y >= n.y - tol && y <= n.y + n.h + tol;
      const nearEdge = Math.min(Math.abs(x - n.x), Math.abs(x - n.x - n.w), Math.abs(y - n.y), Math.abs(y - n.y - n.h)) <= tol;

  function measure(n) {

  // ---------- Shape recognition: rough stroke → clean shape ----------
  function recognize(pts) {
    const m = pts.length / 3; if (m < 8) return null;

    const w = maxx - minx, h = maxy - miny, z = S.cam.z;
    const sx = pts[0], sy = pts[1], ex = pts[m * 3 - 3], ey = pts[m * 3 - 2], chord = Math.hypot(ex - sx, ey - sy);
    if (L * z < 40) return null;
    // Straight line (snaps to horizontal/vertical within 7°)
    if (chord / L > 0.94) {
      let x2 = ex, y2 = ey; const a = Math.abs(Math.atan2(ey - sy, ex - sx) * 180 / Math.PI);
      if (a < 7 || a > 173) y2 = sy; else if (Math.abs(a - 90) < 7) x2 = sx;
      return { kind: 'line', label: 'a straight line', x1: sx, y1: sy, x2, y2 };
    }
    const diag = Math.hypot(w, h);
    if (Math.max(w, h) * z < 40 || Math.min(w, h) * z < 16 || chord > diag * 0.3) return null;
    let er = 0, ee = 0; const cx = minx + w / 2, cy = miny + h / 2, s = Math.min(w, h);
    for (let i = 0; i < m; i++) {
      const x = pts[i * 3], y = pts[i * 3 + 1];
      er += Math.min(Math.abs(x - minx), Math.abs(x - maxx), Math.abs(y - miny), Math.abs(y - maxy)) / s;
      ee += Math.abs(Math.hypot((x - cx) / (w / 2), (y - cy) / (h / 2)) - 1);
    }
    er /= m; ee /= m;
    const perR = 2 * (w + h), a = w / 2, b = h / 2;
    const perE = Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
    if (er < ee && er < 0.07 && L / perR > 0.8 && L / perR < 1.4) return { kind: 'rect', label: 'a rectangle', x: minx, y: miny, w, h };
    if (ee <= er && ee < 0.12 && L / perE > 0.8 && L / perE < 1.45) return { kind: 'ellipse', label: 'an ellipse', x: minx, y: miny, w, h };
    return null;
  }

  // ---------- Node factories ----------
  function makeStroke(pts, pen, sw) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (let i = 0; i < pts.length; i += 3) { minx = Math.min(minx, pts[i]); maxx = Math.max(maxx, pts[i]); miny = Math.min(miny, pts[i + 1]); maxy = Math.max(maxy, pts[i + 1]); }
    const rel = []; for (let i = 0; i < pts.length; i += 3) rel.push(+(pts[i] - minx).toFixed(2), +(pts[i + 1] - miny).toFixed(2), +pts[i + 2].toFixed(3));

    return { id: nid(), type: 'stroke', x: minx, y: miny, w, h, pw: w, ph: h, pts: rel, color: S.color, sw, pen };
  }
  function makeShape(r, sw) {
    if (r.kind === 'line') {
      const x = Math.min(r.x1, r.x2), y = Math.min(r.y1, r.y2), w = Math.max(Math.abs(r.x2 - r.x1), 1), h = Math.max(Math.abs(r.y2 - r.y1), 1);
      return { id: nid(), type: 'line', x, y, w, h, pw: w, ph: h, pts: [r.x1 - x, r.y1 - y, r.x2 - x, r.y2 - y], color: S.color, sw: Math.max(2, sw * 0.8) };
    }
    return { id: nid(), type: r.kind, x: r.x, y: r.y, w: r.w, h: r.h, r: 0, stroke: S.color, fill: null, sw: Math.max(2, sw * 0.8) };
  }
  const colorOf = (n) => n.type === 'rect' || n.type === 'ellipse' ? (n.fill || n.stroke) : n.color;
  function setColor(n, c) {

    else if (n.type !== 'frame') n.color = c;
  }

  // ---------- Input ----------
  const touches = new Map();
  let pinch = null, spaceDown = false, lastTap = { id: null, t: 0 };
  const fingersNavigate = () => S.pencil && S.finger === 'move';

  function enablePencil() {
    S.pencil = true; save(); updateUI();
    toast('Apple Pencil detected. Your fingers now move the canvas and select things.', null, null, 5500);
  }

  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    closePops();
    if (editing) commitText();
    if (e.pointerType === 'pen' && !S.pencil) enablePencil();
    if (e.pointerType === 'touch') {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

  });

  function startTool(e, p) {
    const id = e.pointerId, z = S.cam.z;
    switch (S.tool) {
      case 'draw': {
        const pen = e.pointerType === 'pen';

      }

      case 'frame': G = { kind: 'frame', id, x0: p.x, y0: p.y, x1: p.x, y1: p.y }; break;
      case 'text': G = { kind: 'text', id, p }; break;
      case 'select': {
        if (S.sel.size === 1) {

          }

        }
        break;
      }
    }
    updateUI(); requestRender();
  }

  function startMove(id, p) {
    const moving = new Map();
    for (const n of selected()) moving.set(n.id, n);
    // Moving a frame carries what sits inside it.
    for (const f of selected()) {
      if (f.type !== 'frame') continue;
      for (const n of S.nodes) {
        if (n.type === 'frame' || moving.has(n.id)) continue;
        const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
        if (cx > f.x && cx < f.x + f.w && cy > f.y && cy < f.y + f.h) moving.set(n.id, n);

    }

  }

  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'pen' && e.buttons === 0 && !G) {

      case 'touchpan': case 'pan': {

  function endPointer(e, cancelled) {

    const p = toWorld(e.clientX, e.clientY), z = S.cam.z;

      case 'touchpan':
        if (!g.moved && e.timeStamp - g.t0 < 350 && !cancelled) tapSelect(p, e.timeStamp);

      case 'erase': if (!g.any) past.pop(); else save(); break;
      case 'frame': {
        const r = rectOf(g.x0, g.y0, g.x1, g.y1);
        if (r.w * z > 12 && r.h * z > 12) {
          checkpoint();
          const f = { id: nid(), type: 'frame', ...r, name: `Frame ${S.nodes.filter((n) => n.type === 'frame').length + 1}` };

        }
        break;
      }
      case 'text': {

        break;
      }
      case 'move': if (g.moved) save(); break;
      case 'resize': if (g.moved) save(); break;
      case 'marquee': {
        const r = rectOf(g.x0, g.y0, g.x1, g.y1);
        if (r.w * z > 4 || r.h * z > 4) for (const n of S.nodes) if (n.x >= r.x && n.y >= r.y && n.x + n.w <= r.x + r.w && n.y + n.h <= r.y + r.h) S.sel.add(n.id);

  }
  cv.addEventListener('pointerup', (e) => endPointer(e, false));
  cv.addEventListener('pointercancel', (e) => endPointer(e, true));
  cv.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && S.hover) { S.hover = null; requestRender(); } });

  function tapSelect(p, t) {
    const n = hit(p.x, p.y);
    if (n && n.type === 'text' && (S.tool === 'text' || (lastTap.id === n.id && t - lastTap.t < 400))) { editText(n, false); return; }
    if (n) { S.sel = new Set([n.id]); lastTap = { id: n.id, t }; }
    else if (S.sel.size) S.sel.clear();
    else if (S.tool === 'text') createText(p);
  }

  function finishStroke(g, p, t) {
    const a = g.pts, z = S.cam.z;
    let L = 0; for (let i = 3; i < a.length; i += 3) L += Math.hypot(a[i] - a[i - 3], a[i + 1] - a[i - 2]);
    if (L * z < 6) { tapSelect(p, t); return; }         // a tap selects; a drag draws
    S.sel.clear();
    checkpoint();
    const stroke = makeStroke(a, g.pen, g.sw);
    const r = S.autoShape ? recognize(a) : null;
    if (r) {
      const shape = makeShape(r, g.sw);
      S.nodes.push(shape);
      toast(`Turned into ${r.label}.`, 'Keep my drawing', () => {
        const i = S.nodes.findIndex((n) => n.id === shape.id);
        if (i >= 0) { checkpoint(); S.nodes[i] = stroke; changed(); }
      });
    } else S.nodes.push(stroke);
    save();
  }

  function eraseAt(p) {
    const n = hit(p.x, p.y);
    if (n && n.type !== 'frame') { S.nodes = S.nodes.filter((m) => m !== n); S.sel.delete(n.id); G.any = true; }
  }

  function cancelGesture() {
    if (!G) return;
    if ((G.kind === 'move' || G.kind === 'resize') && G.moved) S.nodes = JSON.parse(past.pop());
    if (G.kind === 'erase') { if (G.any) S.nodes = JSON.parse(past.pop()); else past.pop(); }
    G = null; requestRender();
  }

  // Two fingers: pinch to zoom and pan. A quick two-finger tap undoes; three fingers redo.
  function startPinch(t) {
    const [a, b] = [...touches.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, cam0: { ...S.cam }, t0: t, maxN: touches.size, moved: false };
  }
  function updatePinch() {
    if (touches.size < 2) return;
    const [a, b] = [...touches.values()], c = pinch.cam0;
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (Math.abs(d - pinch.d0) > 10 || Math.hypot(m.x - pinch.m0.x, m.y - pinch.m0.y) > 10) pinch.moved = true;
    if (!pinch.moved) return;
    const z = clampZ(c.z * d / pinch.d0), wx = (pinch.m0.x - c.x) / c.z, wy = (pinch.m0.y - c.y) / c.z;
    S.cam = { x: m.x - wx * z, y: m.y - wy * z, z };
    requestRender(); updateZoomLabel();
  }
  function endPinch(t) {
    if (!pinch.moved && t - pinch.t0 < 350) { if (pinch.maxN >= 3) redo(); else undo(); }
    pinch = null; save();
  }
  const clampZ = (z) => Math.min(32, Math.max(0.1, z));
  function zoomAt(sx, sy, f) {
    const z = clampZ(S.cam.z * f), w = toWorld(sx, sy);
    S.cam = { x: sx - w.x * z, y: sy - w.y * z, z }; updateZoomLabel(); requestRender();
  }
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
    else { S.cam.x -= e.deltaX; S.cam.y -= e.deltaY; requestRender(); }
    save();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  function fit(nodes) {
    if (!nodes.length) { S.cam = { x: W / 2, y: H / 2, z: 1 }; updateZoomLabel(); requestRender(); return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y - 24); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); }
    const top = 84, bottom = 104, side = 32;
    const z = clampZ(Math.min((W - side * 2) / (x1 - x0), (H - top - bottom) / (y1 - y0), 1.5));
    S.cam = { z, x: (W - (x1 - x0) * z) / 2 - x0 * z, y: top + (H - top - bottom - (y1 - y0) * z) / 2 - y0 * z };
    updateZoomLabel(); requestRender(); save();
  }

  // ---------- Text ----------
  const ed = $('editor');
  function createText(p) {
    checkpoint();
    const n = { id: nid(), type: 'text', x: p.x, y: p.y, size: Math.round(20 / S.cam.z), weight: 500, text: '', color: S.color === '#ffffff' ? SWATCHES[0] : S.color, w: 4, h: 4 };
    n.y -= n.size * 0.6;
    S.nodes.push(n); editText(n, true);
  }
  function editText(n, isNew) {
    editing = n.id; ed.dataset.new = isNew ? '1' : '';
    if (!isNew) checkpoint();
    const s = toScreen(n.x, n.y);
    Object.assign(ed.style, { left: s.x + 'px', top: s.y + 'px', fontSize: n.size * S.cam.z + 'px', fontWeight: n.weight || 500, color: n.color });
    ed.value = n.text; ed.hidden = false; sizeEditor(); ed.focus();
    S.sel.clear(); updateUI(); requestRender();
  }
  function sizeEditor() {
    const lines = ed.value.split('\n'), n = S.nodes.find((m) => m.id === editing); if (!n) return;
    ctx.font = FONT(n);
    const w = Math.max(24, ...lines.map((l) => ctx.measureText(l).width)) * S.cam.z;
    ed.style.width = w + 12 + 'px'; ed.style.height = lines.length * n.size * 1.25 * S.cam.z + 'px';
  }
  ed.addEventListener('input', sizeEditor);
  ed.addEventListener('keydown', (e) => { if (e.key === 'Escape' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); ed.blur(); } });
  ed.addEventListener('blur', () => commitText());
  function commitText() {
    if (!editing) return;
    const n = S.nodes.find((m) => m.id === editing); editing = null; ed.hidden = true;
    if (!n) return;
    const v = ed.value.replace(/\s+$/, '');
    if (!v) { S.nodes = S.nodes.filter((m) => m !== n); if (ed.dataset.new) past.pop(); }
    else if (v === n.text && !ed.dataset.new) past.pop();
    else { n.text = v; measure(n); S.sel = new Set([n.id]); }
    changed();
  }

  // ---------- Commands ----------
  function del() { if (!S.sel.size) return; checkpoint(); S.nodes = S.nodes.filter((n) => !S.sel.has(n.id)); S.sel.clear(); changed(); }
  function dup() {
    if (!S.sel.size) return; checkpoint();
    const copies = selected().map((n) => ({ ...JSON.parse(JSON.stringify(n)), id: nid(), x: n.x + 24, y: n.y + 24 }));
    S.nodes.push(...copies); S.sel = new Set(copies.map((c) => c.id)); changed();
  }
  function front() {
    if (!S.sel.size) return; checkpoint();
    S.nodes = [...S.nodes.filter((n) => !S.sel.has(n.id)), ...selected()]; changed();
  }
  function setTool(t) { S.tool = t; if (t !== 'select' && t !== 'draw') S.sel.clear(); S.hover = null; updateUI(); requestRender(); }

  window.addEventListener('keydown', (e) => {
    if (e.target === ed) return;
    const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    if (e.key === ' ' && !spaceDown) { spaceDown = true; cv.classList.add('space'); e.preventDefault(); return; }
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (mod && k === 'd') { e.preventDefault(); dup(); return; }
    if (mod && k === 'a') { e.preventDefault(); S.sel = new Set(S.nodes.map((n) => n.id)); setTool('select'); return; }
    if (mod && k === '0') { e.preventDefault(); fit(S.nodes); return; }
    if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomAt(W / 2, H / 2, 1.25); return; }
    if (mod && k === '-') { e.preventDefault(); zoomAt(W / 2, H / 2, 0.8); return; }
    if (mod) return;
    if (k === 'backspace' || k === 'delete') { e.preventDefault(); del(); return; }
    if (k === 'escape') { S.sel.clear(); closePops(); $('sheetWrap').hidden = true; updateUI(); requestRender(); return; }
    const map = { v: 'select', p: 'draw', d: 'draw', t: 'text', f: 'frame', e: 'erase' };
    if (map[k]) setTool(map[k]);
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ') { spaceDown = false; cv.classList.remove('space'); } });

  // ---------- Chrome ----------
  const dock = $('dock');
  dock.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);
  $('zoom').addEventListener('click', () => fit(S.nodes));

  function swatchButtons(container, current, onPick) {
    container.replaceChildren(...SWATCHES.map((c) => {
      const b = document.createElement('button');
      b.className = 'sw'; b.setAttribute('aria-label', 'Color ' + c); b.setAttribute('aria-pressed', String(c === current));
      const i = document.createElement('i'); i.style.background = c; b.append(i);
      b.addEventListener('click', (ev) => { ev.stopPropagation(); onPick(c); });
      return b;
    }));
  }
  function openPop(pop, anchor, above) {
    const wasOpen = !pop.hidden; closePops(); if (wasOpen) return;
    pop.hidden = false;
    const a = anchor.getBoundingClientRect(), r = pop.getBoundingClientRect();
    const left = Math.min(Math.max(16, a.left + a.width / 2 - r.width / 2), W - r.width - 16);
    pop.style.left = left + 'px';
    pop.style.top = (above ? a.top - r.height - 10 : a.bottom + 10) + 'px';
  }
  function closePops() { $('colorPop').hidden = true; $('pencilPop').hidden = true; }
  function pickToolColor(c) { S.color = c; save(); updateUI(); swatchButtons($('toolSwatches'), S.color, pickToolColor); }
  $('colorBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    swatchButtons($('toolSwatches'), S.color, pickToolColor);
    openPop($('colorPop'), $('colorBtn'), true);
  });
  $('autoShape').addEventListener('click', () => { S.autoShape = !S.autoShape; save(); updateUI(); });
  $('pencilChip').addEventListener('click', (e) => { e.stopPropagation(); openPop($('pencilPop'), $('pencilChip'), false); });
  $('pencilPop').querySelectorAll('[data-finger]').forEach((b) => b.addEventListener('click', () => { S.finger = b.dataset.finger; save(); updateUI(); closePops(); }));
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.pop') && !e.target.closest('#colorBtn') && !e.target.closest('#pencilChip')) closePops(); });

  // Context bar beside the selection
  const ctxBar = $('ctx');
  function icon(d) { return `<svg class="i" viewBox="0 0 24 24">${d}</svg>`; }
  function buildContextBar() {
    const nodes = selected();
    const shapes = nodes.filter((n) => n.type === 'rect' || n.type === 'ellipse');
    const frag = document.createDocumentFragment();
    const sw = document.createElement('div'); sw.className = 'swatches'; sw.style.flexWrap = 'nowrap'; sw.style.gap = '0';
    const cur = nodes.length ? colorOf(nodes[0]) : null;
    if (nodes.some((n) => n.type !== 'frame')) {
      swatchButtons(sw, cur, (c) => { checkpoint(); for (const n of selected()) setColor(n, c); changed(); });
      frag.append(sw, Object.assign(document.createElement('span'), { className: 'sep' }));
    }
    const btn = (label, svg, fn, extra = '') => {
      const b = document.createElement('button'); b.className = 'btn ' + extra; b.title = label; b.setAttribute('aria-label', label);
      b.innerHTML = icon(svg); b.addEventListener('click', fn); frag.append(b); return b;
    };
    if (shapes.length) {
      const filled = shapes.every((n) => n.fill);
      btn(filled ? 'Remove fill' : 'Fill', '<rect x="4" y="4" width="16" height="16" rx="3"/>' + (filled ? '<rect x="7.5" y="7.5" width="9" height="9" rx="1.5" fill="currentColor"/>' : ''), () => {
        checkpoint(); for (const n of shapes) { if (n.fill) { n.stroke = n.fill; n.fill = null; } else { n.fill = n.stroke || S.color; } } changed();
      }).setAttribute('aria-pressed', String(filled));
      const rects = shapes.filter((n) => n.type === 'rect');
      if (rects.length) {
        const round = rects.every((n) => n.r > 0);
        btn(round ? 'Square corners' : 'Round corners', '<path d="M4 20V11a7 7 0 0 1 7-7h9"/>', () => {
          checkpoint(); for (const n of rects) n.r = n.r > 0 ? 0 : Math.round(Math.min(n.w, n.h) * 0.18); changed();
        }).setAttribute('aria-pressed', String(round));
      }
    }
    btn('Bring to front', '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>', front);
    btn('Duplicate (⌘D)', '<rect x="8" y="8" width="12" height="12" rx="2"/><rect x="4" y="4" width="12" height="12" rx="2"/>', dup);
    btn('Delete', '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', del, 'danger');
    ctxBar.replaceChildren(frag);
  }
  function placeContextBar() {
    const show = S.sel.size && !G && !editing && !pinch;
    if (!show) { ctxBar.hidden = true; return; }
    const ns = selected(); if (!ns.length) { ctxBar.hidden = true; return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of ns) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); }
    const a = toScreen(x0, y0), b = toScreen(x1, y1);
    ctxBar.hidden = false;
    const r = ctxBar.getBoundingClientRect();
    let left = (a.x + b.x) / 2 - r.width / 2, top = a.y - r.height - 18;
    if (top < 76) top = b.y + 18;
    if (top + r.height > H - 96) top = Math.max(76, H - 96 - r.height);
    left = Math.min(Math.max(16, left), W - r.width - 16);
    ctxBar.style.left = left + 'px'; ctxBar.style.top = top + 'px';
  }

  // Toast
  let toastTimer = 0;
  function toast(msg, actLabel, act, ms = 4000) {
    $('toastMsg').textContent = msg;
    const b = $('toastAct'); b.hidden = !actLabel; b.textContent = actLabel || '';
    b.onclick = () => { hideToast(); act && act(); };
    $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms);
  }
  function hideToast() { $('toast').hidden = true; clearTimeout(toastTimer); }

  function updateZoomLabel() { $('zoom').textContent = Math.round(S.cam.z * 100) + '%'; }
  let lastSelKey = '';
  function updateUI() {
    dock.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === S.tool)));
    $('colorDot').style.background = S.color;
    $('autoShape').setAttribute('aria-checked', String(S.autoShape));
    $('undoBtn').disabled = !past.length; $('redoBtn').disabled = !future.length;
    $('pencilChip').hidden = !S.pencil;
    $('pencilPop').querySelectorAll('[data-finger]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.finger === S.finger)));
    const key = [...S.sel].join(',') + '|' + selected().map((n) => colorOf(n) + n.fill + n.r).join(',');
    if (key !== lastSelKey) { lastSelKey = key; if (S.sel.size) buildContextBar(); }
    updateZoomLabel();
  }

  // New design sheet
  const cards = $('cards');
  cards.replaceChildren(...PRESETS.map((p) => {
    const b = document.createElement('button'); b.className = 'card';
    const s = document.createElement('span'); s.className = 'shape';
    const k = p.w ? 70 / Math.max(p.w, p.h) : 0;
    Object.assign(s.style, p.w ? { width: p.w * k + 'px', height: p.h * k + 'px' } : { width: '60px', height: '44px', borderStyle: 'dashed' });
    b.append(s, Object.assign(document.createElement('b'), { textContent: p.name }), Object.assign(document.createElement('small'), { textContent: p.w ? `${p.w} × ${p.h}` : 'Infinite canvas' }));
    b.addEventListener('click', () => {
      checkpoint();
      S.nodes = []; S.sel.clear();
      if (p.w) S.nodes.push({ id: nid(), type: 'frame', x: 0, y: 0, w: p.w, h: p.h, name: p.name });
      $('docName').textContent = p.name + ' design';
      $('sheetWrap').hidden = true; setTool('draw'); fit(S.nodes); changed();
      toast(`New ${p.name === 'Blank' ? 'blank canvas' : p.name + ' design'}. Undo brings back the previous one.`, 'Undo', undo);
    });
    return b;
  }));
  $('newBtn').addEventListener('click', () => { $('sheetWrap').hidden = false; cards.firstChild.focus(); });
  $('sheetCancel').addEventListener('click', () => { $('sheetWrap').hidden = true; });
  $('sheetWrap').addEventListener('pointerdown', (e) => { if (e.target === $('sheetWrap')) $('sheetWrap').hidden = true; });

  // ---------- Example document (marked as an example in the doc name) ----------
  function sample() {
    const N = [];
    const text = (x, y, t, size, weight, color) => { const n = { id: nid(), type: 'text', x, y, text: t, size, weight, color }; measure(n); N.push(n); return n; };
    const rect = (x, y, w, h, o) => N.push({ id: nid(), type: 'rect', x, y, w, h, r: 0, stroke: null, fill: null, sw: 1.5, ...o });
    N.push({ id: nid(), type: 'frame', x: 0, y: 0, w: 393, h: 852, name: 'Sign in' });
    text(24, 112, 'Welcome back', 32, 700, '#1f2233');
    text(24, 158, 'Sign in to keep designing.', 16, 400, '#5e6174');
    rect(24, 214, 345, 52, { r: 12, stroke: '#c9cad6', fill: '#f6f6f9' }); text(40, 231, 'Email', 16, 400, '#8a8d9c');
    rect(24, 280, 345, 52, { r: 12, stroke: '#c9cad6', fill: '#f6f6f9' }); text(40, 297, 'Password', 16, 400, '#8a8d9c');
    rect(24, 364, 345, 56, { r: 14, fill: '#3d47c9' });
    const t = text(0, 382, 'Sign in', 17, 600, '#ffffff'); t.x = 24 + (345 - t.w) / 2;
    const f = text(0, 444, 'Forgot password?', 15, 500, '#3d47c9'); f.x = 24 + (345 - f.w) / 2;
    // Hand-drawn note, made with simulated Pencil pressure
    const ink = (fn, steps, color, sw) => {
      const pts = []; for (let i = 0; i <= steps; i++) { const u = i / steps, [x, y] = fn(u); pts.push(x, y, 0.35 + 0.45 * Math.sin(Math.PI * u)); }
      const prev = S.color; S.color = color; N.push(makeStroke(pts, true, sw)); S.color = prev;
    };
    const red = '#d6453d';
    ink((u) => [612 - 230 * u + 8 * Math.sin(u * 6), 300 + 92 * u * u], 40, red, 2.6);
    ink((u) => [382 + 18 * u, 392 - 16 * u], 6, red, 2.6);
    ink((u) => [382 + 20 * u, 392 + 10 * u], 6, red, 2.6);
    text(470, 254, 'Taller button?', 22, 500, red);
    // A second screen, still a rough sketch
    N.push({ id: nid(), type: 'frame', x: 720, y: 0, w: 393, h: 852, name: 'Home (sketch)' });
    const jag = (x, y, w, h) => ink((u) => {
      const s = u * 4, k = Math.floor(s) % 4, f2 = s - Math.floor(s), j = Math.sin(u * 40) * 1.4;
      return [[x + w * f2, y + j], [x + w + j, y + h * f2], [x + w * (1 - f2), y + h + j], [x + j, y + h * (1 - f2)]][k];
    }, 80, '#1f2233', 2.2);
    jag(744, 96, 345, 180);
    ink((u) => [744 + 220 * u, 312 + Math.sin(u * 22) * 3], 40, '#1f2233', 2.4);
    ink((u) => [744 + 150 * u, 340 + Math.sin(u * 18) * 3], 30, '#1f2233', 2.4);
    jag(744, 380, 165, 120); jag(924, 380, 165, 120);
    return N;
  }

  // ---------- Boot ----------
  readTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); requestRender(); });
  new MutationObserver(() => { readTheme(); requestRender(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } if (saveTimer) flush(); }
    else requestRender();
  });
  resize();
  const saved = store.get();
  if (saved && Array.isArray(saved.nodes)) {
    Object.assign(S, { nodes: saved.nodes, cam: saved.cam || S.cam, color: saved.color || S.color, autoShape: saved.autoShape !== false, pencil: !!saved.pencil, finger: saved.finger || 'move', coachSeen: !!saved.coachSeen });
    if (!saved.nodes.length) $('docName').textContent = 'Blank canvas';
  } else {
    S.nodes = sample();
    $('docName').textContent = 'Example: Sign in';
    fit(S.nodes);
  }
  updateUI(); requestRender();
  if (!S.coachSeen) {
    setTimeout(() => toast('Draw with your finger, mouse or Apple Pencil. Draw a rough box and it becomes a clean rectangle.', 'Got it', null, 9000), 500);
    S.coachSeen = true; save();
  }
})();
</script>
